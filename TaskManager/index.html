<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Task Manager</title>
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<div class="container">
			<h1>Task Manager</h1>

			<form id="task-form" class="task-form">
				<input id="task-input" type="text" placeholder="Enter task title" required />
				<button id="add-btn" type="submit">Add Task</button>
			</form>

		<div class="controls">
			<input id="search-input" type="search" placeholder="Search tasks..." />
			<div class="filters">
				<button type="button" class="filter-btn active" data-filter="all">All</button>
				<button type="button" class="filter-btn" data-filter="pending">Pending</button>
				<button type="button" class="filter-btn" data-filter="completed">Completed</button>
			</div>
		</div>

		<div class="counters">
			<span id="total-count">Total: 0</span>
			<span id="completed-count">Completed: 0</span>
		</div>

		<ul id="task-list" class="task-list"></ul>
	</div>

	<script src="App.js"></script>
	</body>
</html>
